# Style-reviews each PR once, when it's first opened or first marked ready, and records the findings in the category database.
# See docs/style-review.md.
name: Style review

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: style-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check:
    # Fork PRs get neither an OIDC token nor a writable GITHUB_TOKEN, so the review can't run.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      reviewed: ${{ steps.summary.outputs.reviewed }}
    steps:
      # A PR toggled back to draft and ready again fires ready_for_review again; only the first counts.
      - id: summary
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- style-review-summary -->"))) | .id')
          echo "reviewed=$([ -n "$ids" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  review:
    needs: check
    if: ${{ needs.check.outputs.reviewed == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write # workload identity federation with the Claude API and Google Cloud
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/style-review/requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - run: python3 scripts/style-review/ci.py
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          STYLE_REVIEW_MODEL: claude-haiku-5-5
